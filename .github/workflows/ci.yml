name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --ignore-scripts
      - name: typecheck
        run: pnpm run typecheck
      - name: tests
        run: pnpm test
      - name: committed client bundle is up to date
        run: pnpm run build:client --check
      - name: package contents
        run: npm pack --dry-run
